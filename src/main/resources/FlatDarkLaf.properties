# FlatDarkLaf theme customization
@background = #1A1A1A
@foreground = #FFFFFF
@accentColor = #F7FF5E
@selectionBackground = #F7FF5E
@selectionForeground = #1A1A1A

Panel.background = #1A1A1A
control = #1A1A1A
window = #1A1A1A

# Curvatura y bordes suavizados (todas las ventanas)
Button.arc = 16
Component.arc = 16
TextComponent.arc = 16
CheckBox.arc = 8
ProgressBar.arc = 16
ScrollPane.arc = 16
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
TabbedPane.buttonArc = 16
Spinner.arc = 16
ComboBox.arc = 16
PopupMenu.arc = 16
TitlePane.arc = 16

# Tipografía Inter escalada un 25% (13pt base -> 16pt)
defaultFont = 125% Inter

# Componentes y focus
Component.borderColor = #383838
Component.focusColor = #F7FF5E
Component.focusedBorderColor = #F7FF5E
Component.focusWidth = 2

# Botones
Button.background = #2A2A2A
Button.foreground = #FFFFFF
Button.hoverBackground = #363636
Button.focusedBackground = #363636
Button.borderColor = #3E3E3E
Button.focusedBorderColor = #F7FF5E

# Botón por defecto / primario (Amarillo F7FF5E con texto 1A1A1A)
Button.default.background = #F7FF5E
Button.default.foreground = #1A1A1A
Button.default.hoverBackground = #FFFF7A
Button.default.focusedBackground = #FFFF7A
Button.default.focusedBorderColor = #FFFFFF

# Botones conmutables (sidebar menu)
ToggleButton.background = #242424
ToggleButton.foreground = #FFFFFF
ToggleButton.selectedBackground = #F7FF5E
ToggleButton.selectedForeground = #1A1A1A
ToggleButton.hoverBackground = #303030

# Campos de entrada
TextField.background = #242424
TextField.foreground = #FFFFFF
TextField.caretColor = #F7FF5E
TextField.selectionBackground = #F7FF5E
TextField.selectionForeground = #1A1A1A

PasswordField.background = #242424
PasswordField.foreground = #FFFFFF
PasswordField.caretColor = #F7FF5E
PasswordField.selectionBackground = #F7FF5E
PasswordField.selectionForeground = #1A1A1A

TextArea.background = #242424
TextArea.foreground = #FFFFFF
TextArea.caretColor = #F7FF5E
TextArea.selectionBackground = #F7FF5E
TextArea.selectionForeground = #1A1A1A

ComboBox.background = #242424
ComboBox.foreground = #FFFFFF
ComboBox.selectionBackground = #F7FF5E
ComboBox.selectionForeground = #1A1A1A

Spinner.background = #242424
Spinner.foreground = #FFFFFF

# Scrollbar
ScrollBar.track = #1A1A1A
ScrollBar.thumb = #383838
ScrollBar.hoverThumbColor = #4A4A4A

# Separadores y bordes
Separator.foreground = #383838
SplitPaneDivider.draggingColor = #F7FF5E

# Tablas y Listas
Table.rowHeight = 36
Table.background = #1A1A1A
Table.foreground = #FFFFFF
Table.selectionBackground = #F7FF5E
Table.selectionForeground = #1A1A1A

List.background = #1A1A1A
List.foreground = #FFFFFF
List.selectionBackground = #F7FF5E
List.selectionForeground = #1A1A1A

# Diálogos y ventanas emergentes
OptionPane.background = #1A1A1A
OptionPane.messageForeground = #FFFFFF
PopupMenu.background = #242424
PopupMenu.borderColor = #383838
